description: |-
  "Well designed machines are sexy!"

  Join me for Episode 10 of the podcast. This time my guest is the legendary Dennis Hong, Professor of Robotics at the University of California, Los Angeles. 

  The Washington Post called him the Leonardo da Vinci of robotics, he is the go-to expert whenever Hollywood needs a robot, and he has appeared on shows like MasterChef USA and Magic for Humans. Dennis is truly one of the few remaining modern polymaths, and it was a pleasure to talk with him not only about robotics, but also about his expert-level knowledge in fields as diverse as magic, cooking, and art.

  For me, Episode 10 was definitely 10/10 on the fun scale. Go watch it now!

