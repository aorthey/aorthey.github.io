description: |-
  Everyone talks AI, but what is intelligence, actually?
  
  Join me and Prof. Oliver Brock, director of the Science of Intelligence excellence cluster, for a deep-dive into the science of intelligence, robotics, protein folding, and his startup side quests.

  Here are my three personal highlights from this podcast:

  - Oliver believes that intelligence manifests itself through behavior, and that behavior depends on a small set of principles. One of those principles, he believes, is active interconnection, where information flows between different parts of a system, guided by optimization.

  - He recounts his truly inspiring life-story, including how we grew up in the 80s in West Berlin, what he did when the wall came down, how he found his way into Stanford University, and how he became the CTO of a company raising $200M in funding.

  - By linking protein folding to robotics, Oliver explains how Deepmind's AlphaFold achieved a breakthrough in finding stable protein folding states, what Levinthal's paradox entails, and that necessity has driven nature to excel at protein folding.

