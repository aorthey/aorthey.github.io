notes: |-
  Special thanks to the Science of Intelligence excellence cluster, especially Maria Ott, for providing the podcast room for this episode and help with setting everything up.

  Unfortunately, the audio of this episode got scrambled during recording due to a microphone malfunctioning. I had to reconstruct roughly 90 percent of this episode using AI tools. To do this, I used ElevenLabs.io to generate a transcription of the scrambled audio (which was surprisingly good) and then used their voice cloning tool to regenerate the audio in Oliver's voice. Unfortunately, the voice cloning introduced an accent to Oliver's voice, so the voice you hear is not the original voice of Oliver. However, the content is preserved and has not been altered from the original. Furthermore, this process led to some mismatch between lips and audio, which made the video stream unusable. I used different tools like facefusion.io, sync.so and diff2lip to finally restore the lips to be in synchronization with the audio from the voice cloning. The final video still has some audio and video artifacts plus the additional accent for Oliver's voice, but it was the best that could be achieved with the tools available to date.

