description: |-
  I recently talked with James Kuffner at the ICRA conference in Rotterdam in the Netherlands. Topics included getting into Stanford, his contributions to robot motion planning, robotics in japan, the google self-driving car project, Woven city, and his advice on becoming successful.

references: ~

errata:
  - 49:16 James wants to add that the CMU car went 7.32 miles and not about 17 miles in the first DARPA grand challenge.
  - |
    01:24:13 The success quote is from Ralph Waldo Emerson and not E. Pugh. The original quote is "What is success? To laugh often and much; to win the respect of intelligent people and the affection of children; to earn the appreciation of honest critics and endure the betrayal of false friends; to appreciate the beauty; to find the best in others; to leave the world a bit better, whether by a healthy child, a garden patch Or a redeemed social condition; to know even one life has breathed easier because you have lived. This is to have succeeded!" -- Ralph Waldo Emerson

