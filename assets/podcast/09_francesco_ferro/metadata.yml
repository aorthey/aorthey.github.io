description: |-
  PAL Robotics is one of the most successful robotics companies in Europe, with more than 200 robots deployed in over 15 countries. 

  Join me for an in-depth discussion with co-founder and CEO Francesco Ferro. We talk about the different robotics products PAL Robotics has launched, the challenges the company has faced, and what is needed to actually build a cashflow positive robotics company.

  I am happy that Francesco shared his insights with me. Please enjoy this episode!

