description: |-
  Join me for a podcast episode with the brilliant Jamie Paik (Professor at EPFL, Head of Reconfigurable Robotics Lab). 
  
  We explore her upbringing where she was torn between science and art, her contributions to reconfigurable and soft robotics, her pioneering work on Robogamis (Origami Robots), and her patented JAiMY tool for Laparoscopic surgery. 

  I am super grateful to Jamie for not only for participating in this episode but also for generously sharing her insights into research, teaching, and mentoring. 

